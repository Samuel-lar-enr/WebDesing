<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/estilos.css">
    <title>Document</title>
</head>
<body class="bg-black h-screen flex items-center justify-center p-4 text-left">
    <div class="bg-gray-900 text-white border border-white-900 rounded-2xl p-8 flex flex-col w-full max-w-sm shadow-2xl text-left opacity-90">
        <h1 class="text-3xl font-bold mb-8 ">Sign Up</h1>
        <form action="" class="flex flex-col gap-2">
            <div class="flex flex-col gap-2 mb-4">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" 
                class="border border-white rounded-lg p-2 bg-gray-850 text-white "
                placeholder="Enter your name">
            </div>
            <div class="flex flex-col gap-2 mb-4">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                class="border border-white rounded-lg p-2 bg-gray-850 text-white"
                placeholder="Enter your email">
            </div>
            <div class="flex flex-col gap-2 mb-4">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                class="border border-white rounded p-2 bg-gray-850 text-white"
                placeholder="Enter your password">
            </div>
            <div class="flex items-center gap-2 mb-4">
                <input type="checkbox" id="terminos" name="terminos">
                <label for="terminos">Acepto los terminos y condiciones</label>
            </div>
            <button type="submit" class="bg-blue-700 text-white border border-sky-900 rounded-lg p-2 w-full">Enviar</button>
        </form>
    </div>
</body>
</html>
